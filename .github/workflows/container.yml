name: Container validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    name: Production container
    runs-on:
      group: Default
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build production container
        env:
          DOCKER_BUILDKIT: 1
        run: docker build --tag portfolio:${{ github.sha }} .

      - name: Remove validation image
        if: always()
        run: docker image rm "portfolio:${{ github.sha }}" || true
